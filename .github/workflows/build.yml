name: Build Installers

# 三平台桌面安装包：Windows(Inno Setup) / macOS(dmg) / Linux(deb)
# 触发：打 tag v* 自动构建并发布 Release；或手动 workflow_dispatch

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos }
          - { os: ubuntu-22.04, platform: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # ---- ffmpeg 随包（各平台静态/官方构建 → bin/） ----
      - name: Download ffmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe  | Select-Object -First 1).FullName bin/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName bin/ffprobe.exe
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

      - name: Download ffmpeg (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p bin
          brew install ffmpeg
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg"  bin/
          cp "$(brew --prefix ffmpeg)/bin/ffprobe" bin/

      - name: Download ffmpeg (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p bin
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg  bin/
          cp ffmpeg-*-amd64-static/ffprobe bin/

      # ---- Linux 需要 GTK/WebKit 系统库（pywebview 后端） ----
      - name: Install system libs (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2gtk-4.1 libcairo2-dev
          pip install pygobject

      # ---- PyInstaller 构建（build.py 已跨平台适配） ----
      - name: Build app
        run: python build.py

      # ---- 平台安装包 ----
      - name: Make installer (Windows / Inno Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile installer/ChineseSimplified.isl
          $ver = python -c "import build; print(build.APP_VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer/installer.iss

      - name: Make DMG (macOS)
        if: matrix.platform == 'macos'
        run: |
          VER=$(python -c "import build; print(build.APP_VERSION)")
          hdiutil create -volname "视频下载助手" -srcfolder "dist/视频下载助手.app" -format udzo -o "视频下载助手-${VER}-macos.dmg"

      - name: Make deb (Linux)
        if: matrix.platform == 'linux'
        run: |
          VER=$(python -c "import build; print(build.APP_VERSION)")
          mkdir -p pkg/DEBIAN "pkg/opt/视频下载助手" pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps
          cat > pkg/DEBIAN/control <<EOF
          Package: video-downloader-assistant
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: 视频下载助手 contributors
          Description: 对话式视频下载工具
           发链接或一句话即可下载 B站/抖音/微博等视频。
          EOF
          cat > "pkg/usr/share/applications/视频下载助手.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=视频下载助手
          Exec=/opt/视频下载助手/视频下载助手
          Icon=视频下载助手
          Categories=Network;Utility;
          EOF
          cp assets/app_256.png "pkg/usr/share/icons/hicolor/256x256/apps/视频下载助手.png"
          cp -r "dist/视频下载助手/." "pkg/opt/视频下载助手/"
          dpkg-deb --build pkg "视频下载助手-${VER}-linux-amd64.deb"

      # ---- 收集产物 ----
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.platform }}" in
            windows) cp installer/installer_out/*.exe out/ ;;
            macos)   cp *.dmg out/ ;;
            linux)   cp *.deb out/ ;;
          esac
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: out/
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
